name: CI

on: [push, pull_request]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOCS_PATH: ${{ secrets.DOCS_PATH }}
  DOCS_BRANCH: ${{ secrets.DOCS_BRANCH }}

jobs:
  can_document:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.check_job.outputs.value }}
    steps:
      - name: Checks whether documentation can be built
        id: check_job
        run: |
            echo "value: ${{ env.DOCS_PATH != null && github.ref == env.DOCS_BRANCH }}"
            echo "value=${{ env.DOCS_PATH != null && github.ref == env.DOCS_BRANCH }}" >> "${GITHUB_OUTPUT}"

  documentation:
    needs: [can_document]
    runs-on: ubuntu-latest
    if: needs.can_document.outputs.value == 'true'

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "20.x"
        registry-url: 'https://registry.npmjs.org'

    - name: Install Dependencies
      run: |
        cd $DOCS_PATH
        npm install

    - name: Deploy Doclet
      run: |
        cd $DOCS_PATH
        npx pilet publish --fresh --url https://feed.piral.cloud/api/v1/pilet/anglesharp --api-key ${{ secrets.PIRAL_FEED_KEY }}

  linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - name: Build
      run: ./build.sh

  windows:
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # request the OIDC token for NuGet trusted publishing

    steps:
    - uses: actions/checkout@v5

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    # Exchanges the GitHub OIDC token for a short-lived (1 hour) NuGet API key.
    # Requires a trusted publishing policy on nuget.org for this repository and workflow file.
    - name: NuGet login
      id: nuget_login
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Build
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: |
        if ($env:GITHUB_REF -eq "refs/heads/main") {
          .\build.ps1 -Target Publish
        } elseif ($env:GITHUB_REF -eq "refs/heads/devel") {
          .\build.ps1 -Target PrePublish
        } else {
          .\build.ps1
        }
